# A pushed v* tag (made by scripts/release.py) checks the tag against
# pyproject.toml, runs the CI workflow, builds the wheel and sdist and publishes
# one GitHub release with the CHANGELOG.md section as its notes. A manual run
# (Run workflow in the Actions tab) does everything but publish; the archives
# are left as a workflow artifact.
#
# Adapting this starter to a new project: nothing here names the project. The
# starter itself never runs this on a tag: scripts/release.py refuses to tag
# while `starter = true` under [tool.release] in pyproject.toml.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      # The script is standard library only, so nothing is installed first.
      - name: Check the tag matches pyproject.toml
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python scripts/release.py check-version "$GITHUB_REF_NAME"
          else
            python scripts/release.py version
          fi
      - name: Check the release notes exist
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/release.py notes "${{ steps.version.outputs.version }}" > /dev/null

  ci:
    # The same lint and test jobs a pull request gets, PostgreSQL included.
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install the Poetry that wrote poetry.lock
        run: pip install "poetry==$(sed -n 's/.*generated by Poetry \([0-9.]*\).*/\1/p' poetry.lock | head -1)"
      - run: poetry build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    # One job creates the release once everything passed, so a failed check
    # never leaves a release behind. Nothing is published on a manual run.
    needs: [verify, ci, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release.py notes "${{ needs.verify.outputs.version }}" > release-notes.md
      # gh is on every GitHub runner; no third-party action to keep updated.
      - name: Create the GitHub release
        run: |
          flags=()
          if [[ "${{ needs.verify.outputs.prerelease }}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md "${flags[@]}"
