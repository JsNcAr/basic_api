# Lint and tests on every push to main and every pull request.
#
# Adapting this starter to a new project: edit the `env` block below and the
# `postgres` matrix value; nothing in the jobs refers to the project by name.
# The other rename points live outside this file: the package directory under
# src/ and the `packages` entry in pyproject.toml, the four `from basic_api`
# imports at the top of tests/conftest.py, the `title` in src/basic_api/main.py,
# and the `service` name returned by /health.
#
# Two versions are not pinned here on purpose:
# - Poetry is read from poetry.lock's header, so CI always runs the Poetry that
#   wrote the lock. Versions compute the lock's content hash differently, and a
#   mismatch fails `poetry install` with "pyproject.toml changed significantly".
# - Python is read from `requires-python` in pyproject.toml by setup-python.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Paths black and flake8 check; mypy takes its paths from [tool.mypy].
  CODE_PATHS: src tests
  # Throwaway database for the test job. None of these are secrets. The values
  # feed both the postgres service and tests/conftest.py, which builds the test
  # database URL from DB_*; change TEST_DB_NAME if the project's conftest
  # default changes, nothing else needs to match the project.
  DB_USER: ci
  DB_PASSWORD: ci
  DB_HOST: localhost
  DB_PORT: "5432"
  TEST_DB_NAME: ci_test_db
  # The app refuses to import without these two; any value works in CI.
  JWT_SECRET_KEY: ci-only-not-a-secret
  API_KEY: ci-only-not-a-secret

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - name: Install the Poetry that wrote poetry.lock
        run: pip install "poetry==$(sed -n 's/.*generated by Poetry \([0-9.]*\).*/\1/p' poetry.lock | head -1)"
      - run: poetry install --no-interaction
      - run: poetry run black --check ${{ env.CODE_PATHS }}
      - run: poetry run flake8 ${{ env.CODE_PATHS }}
      - run: poetry run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The PostgreSQL major the project targets. A service image cannot read
        # the `env` context, so the version lives here; add entries to test more.
        postgres: ["17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
          POSTGRES_DB: ${{ env.TEST_DB_NAME }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - name: Install the Poetry that wrote poetry.lock
        run: pip install "poetry==$(sed -n 's/.*generated by Poetry \([0-9.]*\).*/\1/p' poetry.lock | head -1)"
      - run: poetry install --no-interaction
      - run: poetry run pytest
