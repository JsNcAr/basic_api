[pytest]
minversion = 6.0
addopts = -ra -q
testpaths = tests
pythonpath = src
python_files = test_*.py
# Every warning is an error: a deprecation in our code or in a dependency fails
# the run instead of scrolling past in the summary. Fix it, update the
# dependency, or record it in docs/known_issues.md with a narrow ignore below.
filterwarnings =
    error
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
