[pytest]
minversion = 6.0
addopts = -ra -q
testpaths = tests
pythonpath = src
python_files = test_*.py
# Third-party only, tracked in docs/known_issues.md (slowapi and Python 3.16).
# Never a blanket ignore: a new deprecation in our own code must stay visible.
filterwarnings =
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
