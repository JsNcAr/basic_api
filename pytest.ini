[pytest]
minversion = 6.0
addopts = -ra -q
testpaths = tests
pythonpath = src
python_files = test_*.py
# No warning filters: a deprecation in our code or a dependency stays visible
# in the summary and is dealt with (or recorded in docs/known_issues.md).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
