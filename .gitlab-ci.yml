# Lint, tests and releases on a GitLab instance. The GitHub equivalents are
# .github/workflows/ci.yml and release.yml; both hosts read the same sources
# of truth, so nothing is pinned twice: Python from .python-version (checked
# against PYTHON_VERSION below), Poetry from poetry.lock's header, the
# version and the release notes through scripts/release.py.
#
# Adapting this starter to a new project: edit the `variables` block and the
# postgres image tag in `test`; nothing in the jobs refers to the project by
# name. The starter itself never gets a v* tag (scripts/release.py refuses
# while [tool.release] starter = true), so the release jobs are dormant here.

# One pipeline per change: a branch with an open merge request gets the merge
# request pipeline only, not a second branch pipeline for the same commit.
# A v* tag gets its own pipeline, which adds the release jobs.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/

stages:
  - lint
  - test
  - build
  - release

variables:
  # The image tag cannot read .python-version, so the minor is repeated here;
  # .python's before_script fails the job if the two disagree.
  PYTHON_VERSION: "3.14"
  # Paths black and flake8 check; mypy takes its paths from [tool.mypy].
  CODE_PATHS: src tests scripts
  # Throwaway database for the test job. None of these are secrets. The
  # POSTGRES_* values configure the service; tests/conftest.py builds the test
  # database URL from DB_*, so the two sets must agree. DB_HOST is the service
  # host name the runner derives from the image name.
  POSTGRES_USER: ci
  POSTGRES_PASSWORD: ci
  POSTGRES_DB: ci_test_db
  DB_USER: ci
  DB_PASSWORD: ci
  DB_HOST: postgres
  DB_PORT: "5432"
  TEST_DB_NAME: ci_test_db
  # The app refuses to import without these two; the secret must be at least
  # 32 bytes (config.py checks), otherwise any value works in CI.
  JWT_SECRET_KEY: ci-only-not-a-secret-but-at-least-32-bytes-long
  API_KEY: ci-only-not-a-secret

# Python with the dev group installed, and pip and Poetry caches that live for
# as long as poetry.lock is unchanged.
.python:
  image: python:${PYTHON_VERSION}-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pypoetry"
  cache:
    key:
      files:
        - poetry.lock
    paths:
      - .cache/pip
      - .cache/pypoetry
  before_script:
    - |
      wanted="$(tr -d '[:space:]' < .python-version)"
      actual="$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
      if [ "$wanted" != "$actual" ]; then
        echo "PYTHON_VERSION=$PYTHON_VERSION gives Python $actual but .python-version says $wanted; keep them in step."
        exit 1
      fi
    - pip install "poetry==$(sed -n 's/.*generated by Poetry \([0-9.]*\).*/\1/p' poetry.lock | head -1)"
    - poetry install --no-interaction

lint:
  extends: .python
  stage: lint
  # Only test saves the cache: its contents change only with poetry.lock, and
  # re-saving it in both jobs costs time for nothing.
  cache:
    policy: pull
  interruptible: true
  script:
    - poetry run black --check $CODE_PATHS
    - poetry run flake8 $CODE_PATHS
    - poetry run mypy
    # Known vulnerabilities in the installed dependencies; the project's own
    # package is editable and not on PyPI, so it is skipped rather than failed.
    - poetry run pip-audit --progress-spinner off --skip-editable

test:
  extends: .python
  stage: test
  # Start at once instead of after lint; build and release still need both.
  needs: []
  interruptible: true
  services:
    # The PostgreSQL major the project targets; CI on GitHub tests the same one.
    - postgres:17
  script:
    - poetry run pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      # Test results show up in the merge request widget.
      junit: report.xml
    expire_in: 1 week

# --- Release pipeline: only on a v* tag made by scripts/release.py ---------

# The script is standard library only, so nothing is installed first: the tag
# must match pyproject.toml and CHANGELOG.md must have the section.
verify:
  stage: lint
  image: python:${PYTHON_VERSION}-slim
  cache: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  script:
    - python scripts/release.py check-version "$CI_COMMIT_TAG"
    - python scripts/release.py notes "$CI_COMMIT_TAG" > release-notes.md
  artifacts:
    paths:
      - release-notes.md
    expire_in: 1 week

build:
  extends: .python
  stage: build
  cache:
    policy: pull
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  needs:
    - verify
    - lint
    - test
  script:
    - poetry build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# One job creates the release once everything passed, so a failed check never
# leaves a release behind. glab authenticates with the job token
# (GLAB_ENABLE_CI_AUTOLOGIN); the wheel and sdist go to the project's generic
# package registry, which accepts the job token, and are linked from the
# release page. release-cli is deprecated since GitLab 18.0; glab replaces it.
release:
  stage: release
  # Pinned, not `latest`: every upstream rebuild of a floating tag leaves the
  # previous image dangling on the runner host.
  image: registry.gitlab.com/gitlab-org/cli:v1.122.0
  cache: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  needs:
    - verify
    - build
  variables:
    GIT_STRATEGY: none
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - |
      glab release create "$CI_COMMIT_TAG" dist/* \
        --name "$CI_COMMIT_TAG" \
        --notes-file release-notes.md \
        --ref "$CI_COMMIT_SHA" \
        --use-package-registry \
        --package-name "$CI_PROJECT_NAME"
